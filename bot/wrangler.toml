name = "telegraph-glossary-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# KV is created automatically on deploy (CI fills in the id; see .github/workflows/deploy.yml).
[[kv_namespaces]]
binding = "KV"

# Re-apply glossary edits made outside the web app (CLI, agents) every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]
