name = "telegraph-glossary-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Replace with your bot's username (without @)
[vars]
BOT_USERNAME = "YourGlossaryBot"

# Create with: npx wrangler kv namespace create KV   and paste the id here
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Re-apply glossary edits made outside the web app (CLI, agents) every 15 minutes
[triggers]
crons = ["*/15 * * * *"]
