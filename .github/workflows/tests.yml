name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web linker (shared spec)
        run: node --test web/tests/*.mjs bot/tests/*.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python package
        run: |
          pip install -e . pytest
          pytest -q
